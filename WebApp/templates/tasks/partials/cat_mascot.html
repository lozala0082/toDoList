{% comment %}
  Cat Mascot Partial Template
  Usage: {% include "tasks/partials/cat_mascot.html" with image_name="bosscat.png" alt_text="Description" cat_type="bosscat" %}
{% endcomment %}
{% load static %}

<div class="cat-mascot" data-cat-type="{{ cat_type }}">
  <svg viewBox="0 0 100 100" class="cat-mascot-svg">
    <defs>
      <pattern id="cat-image-{{ alt_text|slugify }}" patternUnits="userSpaceOnUse" width="100" height="100">
        <image href="{% static 'images/'|add:image_name %}" x="10" y="10" width="80" height="80" preserveAspectRatio="xMidYMid slice" />
      </pattern>
    </defs>
    <circle cx="50" cy="50" r="48" fill="#e2e8f0" stroke="#64748b" stroke-width="2" />
    <circle cx="50" cy="50" r="40" fill="url(#cat-image-{{ alt_text|slugify }})" />
  </svg>
</div>
